name: Agente Matteo

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Installa librerie
        run: |
          pip install requests yfinance
          
      - name: Esegui agente
        run: python agente_matteo_pa.py

name: Supervisore

on:
  workflow_dispatch:  # Solo manuale, niente schedule

jobs:
  sveglia-agente:
    runs-on: ubuntu-latest
    steps:
      - name: Attiva Agente Matteo
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: main.yml
          token: ${{ secrets.SUPERVISOR_TOKEN }}
          
      - name: Riprogramma il prossimo supervisore (tra 24 ore)
        run: |
          # Calcola tra 24 ore
          NEXT_TIME=$(date -d '+24 hours' --iso-8601=seconds)
          
          # Chiama l'API di GitHub per attivare il workflow di nuovo tra 24 ore
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPERVISOR_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/supervisore.yml/dispatches \
            -d "{\"ref\":\"main\"}"
